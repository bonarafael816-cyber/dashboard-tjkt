<!DOCTYPE html>
<html>
<head>
  <title>Dashboard Monitoring Jaringan</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h2>Dashboard Monitoring Jaringan (TJKT)</h2>
  <canvas id="grafik"></canvas>

  <script>
    fetch('data/jaringan.json')
      .then(res => res.json())
      .then(data => {
        new Chart(document.getElementById('grafik'), {
          type: 'line',
          data: {
            labels: data.waktu,
            datasets: [{
              label: 'Bandwidth (Mbps)',
              data: data.bandwidth
            }]
          }
        });
      });
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <title>Dashboard Monitoring Jaringan</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <h2>Dashboard Monitoring Jaringan (TJKT)</h2>

<p><b>Status Jaringan:</b> Normal</p>
<p><b>Rata-rata Bandwidth:</b> 36 Mbps</p>

<canvas id="grafik"></canvas>


  <script>
let index = 0;
let dataCache;

fetch('data/jaringan.json')
  .then(res => res.json())
  .then(data => {
    dataCache = data;
    updateChart();
    setInterval(updateChart, 2000); // update tiap 2 detik
});

let chart;

function updateChart() {
  const labels = dataCache.waktu.slice(0, index + 1);
  const bandwidth = dataCache.bandwidth.slice(0, index + 1);

  if (!chart) {
    chart = new Chart(document.getElementById('grafikBandwidth'), {
      type: 'line',
      data: {
        labels: labels,
        datasets: [{
          label: 'Bandwidth (Mbps)',
          data: bandwidth
        }]
      }
    });
  } else {
    chart.data.labels = labels;
    chart.data.datasets[0].data = bandwidth;
    chart.update();
  }

  index++;
  if (index >= dataCache.waktu.length) index = 0;
}
</script>

</body>
</html>
